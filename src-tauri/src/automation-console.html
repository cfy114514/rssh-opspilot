<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RSSH Terminal Access</title>
<style>
  :root { color-scheme: light dark; font: 14px system-ui, sans-serif; }
  body { max-width: 1100px; margin: auto; padding: 24px; background: Canvas; color: CanvasText; }
  h1 { font-size: 20px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 12px 0; }
  button, select, input { font: inherit; padding: 8px; }
  input:not([type="checkbox"]) { flex: 1; min-width: 180px; }
  pre { height: 48vh; min-height: 180px; overflow: auto; border: 1px solid GrayText; padding: 12px; white-space: pre-wrap; overflow-wrap: anywhere; font-family: ui-monospace, monospace; }
  #status, #note { white-space: pre-wrap; }
</style>
<h1>RSSH · Terminal Access</h1>
<p id="note">Shared live sessions · 共享的实时终端</p>
<div class="row">
  <label for="terminal">Terminal / 终端</label>
  <select id="terminal" aria-label="Terminal / 终端"></select>
  <button id="refresh" type="button">Refresh / 刷新</button>
  <label><input id="auto" type="checkbox" checked> Auto refresh / 自动刷新</label>
</div>
<p id="status" role="status" aria-live="polite">Connecting / 正在连接…</p>
<pre id="screen" aria-label="Terminal screen / 终端画面" tabindex="0"></pre>
<form id="command" class="row">
  <input id="text" aria-label="Command / 命令" placeholder="Command / 命令" autocomplete="off" spellcheck="false" disabled>
  <button id="send" disabled>Run / 执行</button>
</form>
<div id="keys" class="row">
  <button type="button" data-key="Enter" disabled>Enter</button>
  <button type="button" data-key="Ctrl+C" disabled>Ctrl+C</button>
  <button type="button" data-key="Tab" disabled>Tab</button>
  <button type="button" data-key="Escape" disabled>Esc</button>
  <button type="button" data-key="Up" disabled>↑</button>
  <button type="button" data-key="Down" disabled>↓</button>
</div>
<script src="/console.js" defer></script>
</html>
